name: Notebook and data-split checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m pytest -q
      - run: python -m scripts.audit_data --data data.parquet --output outputs/split_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: duplicate-safe-split-audit
          path: outputs/split_audit.json
